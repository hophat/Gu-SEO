<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="robots" content="noindex,nofollow" />
<link rel="icon" type="image/png" href="/favicon.png" sizes="64x64" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
<title>GU SEO Console · Quản trị</title>
<link rel="preload" href="/_fonts/inter-400.woff2" as="font" type="font/woff2" crossorigin />
<link rel="preload" href="/_fonts/inter-500.woff2" as="font" type="font/woff2" crossorigin />
<link rel="preload" href="/_fonts/jetbrains-mono-400.woff2" as="font" type="font/woff2" crossorigin />
<script>
  // Pre-paint theme flash prevention — same logic as old admin.html
  (function(){try{var t=localStorage.getItem('ps_admin_theme');if(t==='dark'){document.documentElement.dataset.theme='dark';}else{document.documentElement.dataset.theme='light';}}catch(e){}})();
</script>
<style>
  /* Loading spinner before React mounts. This runs before the bundle's
     stylesheet applies, so the two accent values it needs are declared
     here rather than read from tokens.css. Keep them in sync with
     :root / :root[data-theme='dark'] in src/admin/styles/tokens.css. */
  #root:empty::after {
    content: '';
    display: block;
    width: 40px;
    height: 40px;
    border: 3px solid #e7e9ea;
    border-top-color: #0f1419;
    border-radius: 50%;
    margin: 200px auto;
    animation: spin 0.8s linear infinite;
  }
  :root[data-theme='dark'] #root:empty::after {
    border-color: #262b2f;
    border-top-color: #ffffff;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) {
    #root:empty::after { animation-duration: 2.4s; }
  }
</style>
<link rel="stylesheet" href="/admin-dist/assets/index.css" />
</head>
<body>
<div id="root"></div>
<script type="module" src="/admin-dist/main.js"></script>
</body>
</html>
